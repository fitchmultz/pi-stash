name: Pi compatibility

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      official-version:
        description: Official stable version resolved for this run; blank resolves latest
        type: string
        default: ''
      fork-ref:
        description: Maintained fork commit resolved for this run; blank resolves main
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    uses: fitchmultz/.github/.github/workflows/resolve-hosts.yml@9b08d65d70a01c74c4e01477ccf9473e86be33ee # main
    with:
      automation-ref: 9b08d65d70a01c74c4e01477ccf9473e86be33ee # main
      official-version: ${{ inputs.official-version }}
      fork-ref: ${{ inputs.fork-ref }}

  compatibility:
    needs: resolve
    if: ${{ !cancelled() }}
    name: compatibility / compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PI_OFFLINE: "1"
      PI_TELEMETRY: "0"
      PI_AUTOMATION_REF: 9b08d65d70a01c74c4e01477ccf9473e86be33ee # main
      npm_config_cache: ${{ github.workspace }}/.npm-cache
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Require resolved latest hosts
        env:
          RESOLVE: ${{ needs.resolve.result }}
        run: test "$RESOLVE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: fork
        with:
          repository: fitchmultz/pi
          ref: ${{ needs.resolve.outputs.fork-ref }}
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build the maintained fork
        shell: bash
        run: |
          npm install --global "$(node -p 'require("./automation/package.json").packageManager')"
          npm --prefix fork ci --ignore-scripts
          npm --prefix fork run hydrate:model-data
          git -C fork diff --exit-code
          npm --prefix fork run build:offline
          git -C fork diff --exit-code
          fork_ref=$(git -C fork rev-parse HEAD)
          node automation/scripts/pack-fork.mjs fork "$RUNNER_TEMP/fork-package" "$fork_ref"
          echo "PI_COMPAT_FORK_REF=$fork_ref" >> "$GITHUB_ENV"
      - name: Qualify official Pi and the fork
        shell: bash
        env:
          OFFICIAL_VERSION: ${{ needs.resolve.outputs.official-version }}
        run: |
          npm install --global "$(node -p 'require("./extension/package.json").packageManager')"
          node automation/scripts/qualify.mjs --repo pi-stash --source "$GITHUB_WORKSPACE/extension" --host official --target "$OFFICIAL_VERSION" --output "$RUNNER_TEMP/official-evidence"
          node automation/scripts/qualify.mjs --repo pi-stash --source "$GITHUB_WORKSPACE/extension" --host fork --target "$RUNNER_TEMP/fork-package" --output "$RUNNER_TEMP/fork-evidence"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-qualification
          path: |
            ${{ runner.temp }}/official-evidence
            ${{ runner.temp }}/fork-evidence
          if-no-files-found: error
          retention-days: 3
