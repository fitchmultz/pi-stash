name: Pi compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: compatibility / compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PI_OFFLINE: "1"
      PI_TELEMETRY: "0"
      PI_AUTOMATION_REF: 2cee5fc8e0df33f2c2186545d85accb47a0d208f # Reviewed pack-fork cwd fix (.github#49)
      npm_config_cache: ${{ github.workspace }}/.npm-cache
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: fork
        with:
          repository: fitchmultz/pi
          ref: main
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check fork support floor
        id: fork-support
        env:
          FORK_REF: ${{ steps.fork.outputs.commit }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
          const version = JSON.parse(readFileSync("fork/packages/coding-agent/package.json")).version;
          const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(version);
          assert.ok(match, `Invalid fork version: ${version}`);
          const supported = Number(match[1]) >= 1 && !version.startsWith("1.0.0-");
          appendFileSync(process.env.GITHUB_OUTPUT, `supported=${supported}\n`);
          if (!supported) {
            const receipt = { result: "unattempted", host: "fork", ref: process.env.FORK_REF, version, floor: "1.0.0", reason: "Fork is older than the supported Pi floor; no build or qualification attempted." };
            mkdirSync(`${process.env.RUNNER_TEMP}/fork-evidence`, { recursive: true });
            writeFileSync(`${process.env.RUNNER_TEMP}/fork-evidence/qualification.json`, JSON.stringify(receipt, null, 2) + "\n");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Fork qualification: UNATTEMPTED\n\nFork \`${receipt.ref}\` is Pi ${version}, below the supported 1.0.0 floor. This is not a future-fork pass. Rerun qualification when the maintained fork reaches the floor.\n`);
            console.log(JSON.stringify(receipt));
          }
          NODE
      - name: Build the maintained fork
        if: steps.fork-support.outputs.supported == 'true'
        shell: bash
        run: |
          npm install --global "$(node -p 'require("./automation/package.json").packageManager')"
          npm --prefix fork ci --ignore-scripts
          npm --prefix fork run hydrate:model-data
          git -C fork diff --exit-code
          npm --prefix fork run build:offline
          git -C fork diff --exit-code
          fork_ref=$(git -C fork rev-parse HEAD)
          node automation/scripts/pack-fork.mjs fork "$RUNNER_TEMP/fork-package" "$fork_ref"
          echo "PI_COMPAT_FORK_REF=$fork_ref" >> "$GITHUB_ENV"
      - name: Qualify official Pi and the fork
        shell: bash
        run: |
          npm install --global "$(node -p 'require("./extension/package.json").packageManager')"
          official=$(node -p 'require("./extension/package.json").devDependencies["@earendil-works/pi-coding-agent"]')
          node automation/scripts/qualify.mjs --repo pi-stash --source "$GITHUB_WORKSPACE/extension" --host official --target "$official" --output "$RUNNER_TEMP/official-evidence"
          if [ "${{ steps.fork-support.outputs.supported }}" = true ]; then
            node automation/scripts/qualify.mjs --repo pi-stash --source "$GITHUB_WORKSPACE/extension" --host fork --target "$RUNNER_TEMP/fork-package" --output "$RUNNER_TEMP/fork-evidence"
          fi
      - name: Retain unsupported fork receipt
        if: steps.fork-support.outputs.supported == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-unattempted
          path: ${{ runner.temp }}/fork-evidence
          if-no-files-found: error
          retention-days: 3
