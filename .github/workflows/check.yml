name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "26"]
    env:
      PI_OFFLINE: "1"
      PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-stash-agent
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci
      - run: npm run smoke:package
      - run: npm run pack:check
