<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Pi Stash draft workflow</title>
  <desc id="desc">Write a draft in Pi. Save the draft with Ctrl+Shift+S. Send another message. Restore a draft with Ctrl+Shift+R, or select a draft from the picker.</desc>
  <defs>
    <!-- Dark design tokens adapted from the modern SVG starter. -->
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#060A12"/>
      <stop offset="0.52" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#080C16"/>
    </linearGradient>
    <radialGradient id="blueBloom" cx="0.18" cy="0.18" r="0.8">
      <stop stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetBloom" cx="0.5" cy="0.5" r="0.6">
      <stop stop-color="#8B5CF6" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#172238" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0E1525" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172554" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#312E81" stop-opacity="0.58"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#02040A" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#60A5FA"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#86EFAC"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .card-title { font: 650 32px Inter, ui-sans-serif, Arial, sans-serif; fill: #F8FAFC; }
      .card-copy { font: 450 27px Inter, ui-sans-serif, Arial, sans-serif; fill: #B6C3D7; }
      .step { font: 700 24px "JetBrains Mono", ui-monospace, monospace; }
      .chip { font: 600 24px "JetBrains Mono", ui-monospace, monospace; }
      .connector { fill: none; stroke-width: 3.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Opaque canvas and restrained background depth. -->
  <rect width="1600" height="500" fill="url(#canvas)"/>
  <rect width="1600" height="500" fill="url(#blueBloom)"/>
  <rect width="1600" height="500" fill="url(#violetBloom)"/>
  <g class="sans">
    <text x="64" y="80" font-size="48" font-weight="700" letter-spacing="-1" fill="#F8FAFC">Save a draft and restore it later</text>
    <text x="64" y="124" font-size="27" fill="#B6C3D7">Use Pi Stash when you need to send another message.</text>
  </g>

  <!-- Arrows indicate the human's sequence, with clear gaps between cards. -->
  <path d="M392 300H434" class="connector" stroke="#60A5FA" marker-end="url(#arrowBlue)"/>
  <path d="M776 300H818" class="connector" stroke="#A78BFA" marker-end="url(#arrowViolet)"/>
  <path d="M1160 300H1202" class="connector" stroke="#86EFAC" marker-end="url(#arrowGreen)"/>

  <!-- 01: the unsent draft. -->
  <g transform="translate(64 176)" filter="url(#shadow)">
    <rect width="320" height="248" rx="24" fill="url(#glass)" stroke="#2A3851"/>
    <circle cx="48" cy="40" r="20" fill="#60A5FA" fill-opacity="0.14"/>
    <text x="48" y="48" text-anchor="middle" class="step" fill="#93C5FD">1</text>
    <path d="M254 29h36M254 40h28M254 51h20" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
    <text x="28" y="92" class="card-title">Write a draft</text>
    <text x="28" y="131" class="card-copy">Write your draft</text>
    <text x="28" y="166" class="card-copy">in the Pi editor.</text>
    <rect x="28" y="188" width="264" height="40" rx="12" fill="#0C1425" stroke="#293750"/>
    <text x="160" y="216" text-anchor="middle" class="chip" fill="#93C5FD">EDITOR</text>
  </g>

  <!-- 02: saving succeeds before the editor is cleared. -->
  <g transform="translate(448 176)" filter="url(#shadow)">
    <rect width="320" height="248" rx="24" fill="url(#focus)" stroke="#6D7DFF" stroke-opacity="0.62"/>
    <circle cx="48" cy="40" r="20" fill="#A78BFA" fill-opacity="0.18"/>
    <text x="48" y="48" text-anchor="middle" class="step" fill="#DDD6FE">2</text>
    <path d="M255 32h35v23h-35zM251 27h43v8h-43M265 44h15" fill="none" stroke="#C4B5FD" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="28" y="92" class="card-title">Save the draft</text>
    <text x="28" y="131" class="card-copy">Pi saves the draft.</text>
    <text x="28" y="166" class="card-copy">Pi clears the editor.</text>
    <rect x="28" y="188" width="264" height="40" rx="12" fill="#0C1425" stroke="#51426F"/>
    <text x="160" y="216" text-anchor="middle" class="chip" fill="#DDD6FE">Ctrl+Shift+S</text>
  </g>

  <!-- 03: the user types and sends the interruption. -->
  <g transform="translate(832 176)" filter="url(#shadow)">
    <rect width="320" height="248" rx="24" fill="url(#glass)" stroke="#2A3851"/>
    <circle cx="48" cy="40" r="20" fill="#60A5FA" fill-opacity="0.14"/>
    <text x="48" y="48" text-anchor="middle" class="step" fill="#93C5FD">3</text>
    <path d="M255 29h35v23h-21l-10 7v-7h-4z" fill="none" stroke="#93C5FD" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="28" y="92" class="card-title">Send a message</text>
    <text x="28" y="131" class="card-copy">Write a message.</text>
    <text x="28" y="166" class="card-copy">Send the message.</text>
    <rect x="28" y="188" width="264" height="40" rx="12" fill="#0C1425" stroke="#293750"/>
    <text x="160" y="216" text-anchor="middle" class="chip" fill="#93C5FD">YOUR MESSAGE</text>
  </g>

  <!-- 04: restore directly or choose from several saved drafts. -->
  <g transform="translate(1216 176)" filter="url(#shadow)">
    <rect width="320" height="248" rx="24" fill="url(#glass)" stroke="#315A48"/>
    <circle cx="48" cy="40" r="20" fill="#86EFAC" fill-opacity="0.14"/>
    <text x="48" y="48" text-anchor="middle" class="step" fill="#86EFAC">4</text>
    <path d="M258 41l10 10 21-23" fill="none" stroke="#86EFAC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="92" class="card-title">Restore a draft</text>
    <text x="28" y="131" class="card-copy">Select a draft when</text>
    <text x="28" y="166" class="card-copy">the picker opens.</text>
    <rect x="28" y="188" width="264" height="40" rx="12" fill="#0C1425" stroke="#315A48"/>
    <text x="160" y="216" text-anchor="middle" class="chip" fill="#86EFAC">Ctrl+Shift+R</text>
  </g>

  <text x="800" y="476" text-anchor="middle" class="sans" font-size="26" fill="#B6C3D7">Saved drafts stay available across Pi sessions in the same working directory.</text>
</svg>
